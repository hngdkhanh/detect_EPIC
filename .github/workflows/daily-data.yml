# Mỗi sáng: hỏi BigQuery KHOẢNG 2 NGÀY (D-1 và D-2) → upsert vào bảng orders trên Supabase.
# Chạy trên GitHub, không cần máy user. KHÔNG deploy: data nằm ở Supabase, app đọc thẳng lúc
# chạy, nên code và data tách hẳn — Vercel tự deploy code từ Git như một project Vite bình thường
# (vercel.json bật lại git.deploymentEnabled.main từ 2026-09-10).
#
# Vì sao 2 ngày chứ không phải 1 (user chốt 2026-09-10): data nguồn sửa lùi — đơn được gán thêm
# vài giờ sau, nên D-1 lấy lúc 10:00 sáng vẫn thiếu. Lấy chồng 2 ngày thì mỗi ngày được lấy hai
# lần: một lần làm D-1, hôm sau một lần nữa làm D-2 (`--replace-date` xoá luôn dòng không còn trong
# lượt mới). Sau lượt thứ hai ngày đó mới ĐÓNG BĂNG. Lỡ một buổi sáng cũng tự vá được.
# Backfill / làm mới nhiều ngày: Run workflow với days lớn hơn (tối đa 60).
#
# push-supabase.mjs giữ SUPABASE_KEEP_DAYS ngày gần nhất (mặc định 90) — ngày cũ hơn bị xoá.
#
# Secrets cần có (Settings → Secrets and variables → Actions):
#   BQ_CREDENTIALS_JSON   JSON credential BigQuery — service account key (nên dùng) hoặc
#                         authorized_user (file %APPDATA%\gcloud\legacy_credentials\<email>\adc.json)
#   SUPABASE_URL          https://<project-ref>.supabase.co
#   SUPABASE_SERVICE_KEY  service_role key / secret key (Project Settings → API) — bỏ qua RLS, chỉ dùng ở CI
name: Daily data → Supabase

on:
  schedule:
    - cron: "0 3 * * *"          # 03:00 UTC = 10:00 Việt Nam
  workflow_dispatch:
    inputs:
      to:
        description: "Ngày cuối YYYY-MM-DD (mặc định D-1 giờ VN)"
        required: false
        default: ""
      days:
        description: "Số ngày hỏi BigQuery, kết thúc ở ngày cuối (2 = mặc định, D-1 + D-2; tối đa 60)"
        required: false
        default: "2"
      dry_run:
        description: "Chỉ chạy query + validate, không ghi vào Supabase"
        type: boolean
        default: false

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BQ_PROJECT: dw-ghn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Kiểm tra secrets
        env:
          HAS_BQ: ${{ secrets.BQ_CREDENTIALS_JSON != '' }}
          HAS_SB_URL: ${{ secrets.SUPABASE_URL != '' }}
          HAS_SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY != '' }}
        run: |
          ok=1
          [ "$HAS_BQ" = "true" ]     || { echo "::error::Thiếu secret BQ_CREDENTIALS_JSON"; ok=0; }
          [ "$HAS_SB_URL" = "true" ] || { echo "::error::Thiếu secret SUPABASE_URL"; ok=0; }
          [ "$HAS_SB_KEY" = "true" ] || { echo "::error::Thiếu secret SUPABASE_SERVICE_KEY"; ok=0; }
          [ $ok = 1 ]

      # Kiểm tra kho đích TRƯỚC khi tốn tiền quét BigQuery: bảng có tồn tại, key ghi được không.
      - name: Kiểm tra Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/push-supabase.mjs --trim-only --dry-run

      - name: Lấy data từ BigQuery → Supabase
        id: fetch
        env:
          BQ_CREDENTIALS_JSON: ${{ secrets.BQ_CREDENTIALS_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IN_TO: ${{ inputs.to }}
          IN_DAYS: ${{ inputs.days || '2' }}
          IN_DRY: ${{ inputs.dry_run }}
        run: |
          echo "hỏi BigQuery: $IN_DAYS ngày"
          args=(--days "$IN_DAYS" --replace-date)
          [ -n "$IN_TO" ] && args+=(--to "$IN_TO")
          [ "$IN_DRY" = "true" ] && args+=(--no-append)
          set +e
          node scripts/fetch-daily.mjs "${args[@]}"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = 2 ]; then
            echo "::warning::BigQuery chưa có dòng nào cho khoảng ngày yêu cầu — Supabase giữ data cũ."
            exit 0
          fi
          # Nguyên nhân số 1 khi bước này đỏ: credential BigQuery hết hạn. Nói luôn cách phân biệt,
          # vì lỗi này đứng im 2 ngày (2026-09-08 → 10) mà không ai biết production đang cũ.
          if [ "$code" != 0 ]; then
            echo "::error::Lấy data thất bại. Nếu log ở trên có 'invalid_rapt': secret BQ_CREDENTIALS_JSON là refresh token cá nhân và đã hết hạn theo chính sách reauth của Google Workspace. Cách phân biệt — so 'vân tay' in ở dòng Backend với vân tay trên máy (chạy: node scripts/fetch-daily.mjs --dry-run). KHÁC nhau = secret chưa được cập nhật, dán lại là xong. GIỐNG nhau = credential loại này không dùng được từ CI, phải xin Data team service account key (script nhận sẵn, chỉ cần đổi giá trị secret)."
          fi
          exit "$code"

      # Supabase phải có D-1 sau khi ghi; thiếu = data warehouse chưa nạp, cảnh báo để người xem biết.
      - name: Supabase phải có ngày cuối
        if: steps.fetch.outputs.code == '0' && inputs.dry_run != true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IN_TO: ${{ inputs.to }}
        run: |
          node -e '
            const url = process.env.SUPABASE_URL.replace(/\/+$/, ""), key = process.env.SUPABASE_SERVICE_KEY;
            const r = await fetch(url + "/rest/v1/order_days?select=load_date,n&order=load_date.asc",
              { headers: { apikey: key, Authorization: "Bearer " + key } });
            if (!r.ok) { console.log("::error::order_days HTTP " + r.status); process.exit(1); }
            const days = await r.json();
            const vn = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Ho_Chi_Minh" }).format(new Date());
            const d = new Date(vn + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() - 1);
            const want = process.env.IN_TO || d.toISOString().slice(0, 10);
            const latest = days.length ? days[days.length - 1].load_date : "(trống)";
            console.log("supabase:", days.map(x => x.load_date + " (" + x.n + ")").join(", "));
            console.log("ngay moi nhat:", latest, "| can co:", want);
            if (latest !== want) console.log("::warning::Supabase chua co data " + want + " — app dang hien ngay cu hon.");
            const fs = await import("node:fs");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              "### Supabase\n```\n" + days.map(x => x.load_date + "  " + x.n).join("\n") + "\n```\n");
          ' --input-type=module
