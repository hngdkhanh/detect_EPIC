server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json text/csv text/plain image/svg+xml;
  gzip_min_length 1024;

  # SPA: mọi đường dẫn không khớp file → index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # bundle có hash trong tên → cache dài hạn
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # dữ liệu CSV có thể thay khi rebuild → không cache lâu
  location ~ \.csv$ {
    add_header Cache-Control "no-cache";
  }
}
